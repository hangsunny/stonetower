<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="shortcut icon" href="favicon.ico">
<title>소원의 돌탑 쌓기</title>
<style>
/* ══════════════════════════════════════
   RESET & VARIABLES
══════════════════════════════════════ */
:root {
  --stone-grey: #999999;
  --ink-black:  #000000;
  --paper-white: #ffffff;
  --bubble-fill: #ffffe6;
  --bubble-stroke: #ffc900;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: var(--paper-white);
  font-family: 'Gulim', '굴림', sans-serif;
  color: var(--ink-black);
  -webkit-tap-highlight-color: transparent;
  touch-action: none;
}

#sky { 
  position: fixed; inset: 0; z-index: 0; 
  background-image: url('background.jpg');
  background-size: cover; background-position: center; background-repeat: no-repeat;
  opacity: 0; transition: opacity 5.5s ease;
}

#phase1, #phase2 {
  position: fixed; inset: 0; z-index: 10;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
}
#phase2 { opacity: 0; pointer-events: none; transition: opacity 0.8s ease; }
#phase2.active { opacity: 1; pointer-events: all; }
#phase1.hidden { opacity: 0; pointer-events: none; transition: opacity 0.8s ease; }

/* ── Phase 1 ── */
#p1-container { position: relative; display: flex; flex-direction: column; align-items: center; user-select: none; width: 100%; }
#p1-stone {
  width: 120px; position: relative; z-index: 2;
  transition: transform 5.0s cubic-bezier(0.4, 0, 0.2, 1), opacity 1s ease 1s;
}
#p1-stone img { width: 100%; display: block; pointer-events: none; }
#p1-stone.roll-out { transform: translateX(130vw) rotate(720deg) !important; }
#p1-stone::after {
  content: ''; position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%);
  width: 80px; height: 14px; background: radial-gradient(ellipse at center, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0) 75%);
  border-radius: 50%; pointer-events: none; z-index: -1; transition: opacity 0.5s;
}
#p1-stone.roll-out::after { opacity: 0; }

#wish-bubble-wrap {
  position: relative; margin-bottom: -20px; z-index: 3; transform-origin: bottom center;
  transition: transform 0.5s ease, opacity 0.5s ease;
  max-width: 90%;
}
#wish-bubble-wrap.shrink { opacity: 0; transform: scale(0) translateY(50px); }
.cloud-svg { display: block; filter: drop-shadow(0 8px 15px rgba(199, 199, 199, 0.2)); max-width: 100%; height: auto; }
#wish-inner { position: absolute; top: 20px; left: 10%; right: 10%; bottom: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
#wish-input { width: 100%; border: none; outline: none; background: transparent; font-size: 16px; color: #443300; font-family: inherit; line-height: 1.4; resize: none; text-align: center; caret-color: var(--bubble-stroke); }

.phase-caption { position: fixed; bottom: 36px; left: 0; width: 100%; text-align: center; font-size: 13px; color: #666; text-shadow: 0 0 5px var(--paper-white); z-index: 20; }

/* ── Phase 2 & Success ── */
#matter-canvas { position: fixed; inset: 0; z-index: 10; cursor: crosshair; touch-action: none; }

#success-overlay {
  position: fixed; inset: 0; z-index: 1000;
  display: none; align-items: center; justify-content: center;
  pointer-events: none; /* 애니메이션 중에도 아래 버튼은 눌려야 하므로 */
}
#success-overlay.show { display: flex; pointer-events: all; }
#ripple-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

.success-content {
  position: relative; z-index: 1005; /* 캔버스 물결보다 위 */
  display: flex; flex-direction: column; align-items: center; gap: 30px;
}

#success-msg { 
  font-size: 22px; font-weight: bold; line-height: 1.6;
  letter-spacing: 0.1em; color: #ffffff; opacity: 0; text-align: center;
}
.success-sub-text { font-size: 0.7em; font-weight: normal; margin-top: 15px; display: block; }

@media (min-width: 768px) { #success-msg { font-size: 38px; } }

#view-archive-btn {
  padding: 14px 28px; border: 1px solid #ffffff; background: transparent;
  color: #ffffff; border-radius: 50px; cursor: pointer; font-family: inherit;
  font-size: 15px; display: none; transition: all 0.3s; opacity: 0;
}
#view-archive-btn:hover { background: #ffffff; color: #000000; }

/* UI Buttons */
#bgm-btn { position: fixed; top: 15px; right: 70px; z-index: 2000; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--ink-black); background: var(--paper-white); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; color: var(--ink-black); transition: all 1s ease; }
#bgm-btn.inverted { border-color: #ffffff !important; color: #ffffff !important; background-color: transparent !important; }

#return-btn { position: fixed; top: 15px; right: 15px; z-index: 2000; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--ink-black); background: var(--paper-white); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; color: var(--ink-black); transition: all 1s ease; }
#return-btn.inverted { border-color: #ffffff !important; color: #ffffff !important; background-color: transparent !important; }

/* Failure */
#collapse-overlay { position: fixed; inset: 0; z-index: 1500; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 20px; background: rgba(255,255,255,0.9); backdrop-filter: blur(5px); }
#collapse-overlay.show { display: flex; }
#collapse-retry { padding: 12px 35px; border-radius: 50px; border: 1px solid var(--ink-black); background: var(--ink-black); color: var(--paper-white); cursor: pointer; }

/* ── Phase 3: Archive (다른 돌탑 보러가기) ── */
#phase3 {
  position: fixed; inset: 0; z-index: 3000; 
  background: var(--paper-white);
  display: none; flex-direction: column; 
  overflow-y: auto; padding: 60px 20px;
  -webkit-overflow-scrolling: touch;
}

#phase3.active { display: flex; }

.archive-header { text-align: center; margin-bottom: 50px; }

#archive-container {
  display: grid; 
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); 
  gap: 60px 20px; 
  max-width: 900px; 
  margin: 0 auto; 
  padding-bottom: 120px;
}

/* 돌과 말풍선 세트 한 줄씩 등장하는 효과 */
.archive-item { 
  display: flex; 
  flex-direction: column; 
  align-items: center; 
  animation: archiveEntrance 0.8s ease-out both; 
}

/* 말풍선 전체(글박스+꼬리)가 둥실둥실 움직이는 컨테이너 */
.arch-bubble-wrap {
  position: relative; 
  display: flex; 
  flex-direction: column; 
  align-items: center; 
  margin-bottom: 15px; 
  width: 100%;
  /* 3초 동안 부드럽게 위아래로 무한 반복 */
  animation: bubbleBobbing 3s ease-in-out infinite;
}

.arch-text-box { 
  background: var(--bubble-fill); 
  border: 1.5px solid var(--bubble-stroke); 
  border-radius: 100px; 
  padding: 10px 20px; 
  font-size: 11px; 
  text-align: center; 
  width: 130px; 
  min-height: 45px; 
  display: flex; 
  align-items: center; 
  justify-content: center; 
  box-shadow: 0 4px 10px rgba(0,0,0,0.05); 
  word-break: break-all; 
  z-index: 2;
}

/* 말풍선 꼬리 동그라미 공통 */
.arch-dot { 
  background: var(--bubble-fill); 
  border: 1px solid var(--bubble-stroke); 
  border-radius: 50%; 
}

/* ── 애니메이션 (Keyframes) 정리 ── */

/* 아카이브 진입 시 슥 올라오는 효과 */
@keyframes archiveEntrance {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

/* 아카이브 말풍선 둥실둥실 (Infinite) */
@keyframes bubbleBobbing {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}

/* 페이즈 2 게임 중 부유하는 말풍선 (사라지는 용) */
@keyframes floatUp { 
  0% { opacity: 0; transform: translateY(0) scale(0.9); } 
  15% { opacity: 1; transform: translateY(-20px) scale(1); } 
  85% { opacity: 1; } 
  100% { opacity: 0; transform: translateY(-160px) scale(1); } 
}

/* 성공 시 메시지 등장용 */
@keyframes msgIn { 
  0% { opacity: 0; transform: scale(0.85); } 
  100% { opacity: 1; transform: scale(1); } 
}

/* 기타 요소 */
.float-bubble { position: fixed; z-index: 100; pointer-events: none; background: var(--bubble-fill); border: 1.5px solid var(--bubble-stroke); border-radius: 12px; padding: 7px 14px; font-size: 12px; color: #443300; box-shadow: 0 4px 12px rgba(255, 201, 0, 0.2); animation: floatUp 4.5s ease-out forwards; white-space: nowrap; }
#ghost-stone { position: fixed; pointer-events: none; z-index: 50; transform: translate(-50%, -50%); display: none; }
</style>
</head>
<body>

<div id="sky"></div>
<button id="bgm-btn" onclick="toggleBgm()">🔊</button>
<button id="return-btn" onclick="location.reload()">↺</button>
<div id="ghost-stone"><img id="ghost-img" src="" alt="" width="80"></div>

<!-- PHASE 1 -->
<div id="phase1">
  <div id="p1-container">
    <div id="wish-bubble-wrap">
      <svg class="cloud-svg" width="320" height="200" viewBox="0 0 320 200">
        <g>
          <circle cx="175" cy="185" r="5" fill="var(--bubble-fill)" stroke="var(--bubble-stroke)" stroke-width="2.5" />
          <circle cx="185" cy="170" r="8" fill="var(--bubble-fill)" stroke="var(--bubble-stroke)" stroke-width="2.5" />
          <circle cx="200" cy="148" r="13" fill="var(--bubble-fill)" stroke="var(--bubble-stroke)" stroke-width="2.5" />
          <path d="M 52 128 C 22 128 8 110 8 90 C 8 72 20 60 36 58 C 32 38 46 22 66 22 C 74 8 92 6 108 16 C 118 4 138 2 156 14 C 170 2 192 0 208 14 C 222 2 246 4 258 20 C 276 18 294 34 294 56 C 310 60 320 74 320 92 C 320 112 306 128 280 130 C 268 142 248 144 228 134 C 208 146 184 148 160 136 C 136 148 110 146 90 134 C 72 142 52 138 52 128 Z" 
          fill="var(--bubble-fill)" stroke="var(--bubble-stroke)" stroke-width="2.5" stroke-linejoin="round"/>
        </g>
      </svg>
      <div id="wish-inner">
        <textarea id="wish-input" rows="2" placeholder="소원을 담고 엔터를 눌러주세요." maxlength="60" autofocus></textarea>
      </div>
    </div>
    <div id="p1-stone"><img src="stone20.png" alt="소원돌"></div>
  </div>
  <div class="phase-caption">돌에 소원을 담으세요 </div>
</div>

<!-- PHASE 2 -->
<div id="phase2"><canvas id="matter-canvas"></canvas>
<div class="phase-caption" id="p2-caption">클릭해서 돌탑을 쌓으세요.</div>
</div>

<!-- SUCCESS OVERLAY (정리됨) -->
<div id="success-overlay">
  <canvas id="ripple-canvas"></canvas>
  <div class="success-content">
    <div id="success-msg"></div>
    <button id="view-archive-btn" onclick="goToPhase3()">다른 돌탑 보러가기</button>
  </div>
</div>

<!-- FAILURE OVERLAY -->
<div id="collapse-overlay">
  <div style="font-size: 24px; font-weight: bold; color: var(--ink-black);">무너졌습니다</div>
  <button id="collapse-retry" onclick="location.reload()">다시 시작 ↺</button>
</div>

<!-- PHASE 3: ARCHIVE -->
<div id="phase3">
  <div class="archive-header">
    <h2 style="font-size:20px;">소원의 돌탑</h2>
    <p style="font-size:12px; color:#888;">최근 24시간 내에 이뤄진 소원들입니다.</p>
  </div>
  <div id="archive-container"></div>
  <button style="position:fixed; bottom:30px; left:50%; transform:translateX(-50%); padding:15px 40px; background:var(--ink-black); color:var(--paper-white); border:none; border-radius:50px; cursor:pointer; font-family:inherit;" onclick="location.reload()">나의 돌탑 쌓기 ↺</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script>
const sfxStone1 = new Audio('stonesound_01.mp3');
const sfxStone2 = new Audio('stonesound_02.mp3');
const sfxFalling = new Audio('stonesfalling.mp3');
const sfxZenBell = new Audio('zenbellsound.mp3');
const sfxBgm = new Audio('bgm.mp3');
sfxBgm.loop = true; sfxBgm.volume = 0.5;
let isBgmPlaying = false;

document.addEventListener('touchstart', function unlock() {
    [sfxStone1, sfxStone2, sfxFalling, sfxZenBell, sfxBgm].forEach(a => { a.play(); a.pause(); a.currentTime = 0; });
    document.removeEventListener('touchstart', unlock);
}, { once: true });

const STONE_FILES = Array.from({length: 22}, (_,i) => `stone${i+1}.png`);
const imgCache = {};
STONE_FILES.forEach(src => { const img = new Image(); img.src = src; imgCache[src] = img; });
imgCache['stone20.png'] = imgCache['stone20.png'] || (() => { const i = new Image(); i.src = 'stone20.png'; return i; })();

let userWish = '';
let successFired = false;
let phase2Active = false;
let isTransitioning = false;
const floatMsgs = ['소원이 곧 이루어 질 것 같아 ✨', '하늘이 듣고 있어요 🌙', '돌 하나하나에 마음을 담아요', '염원이 모여 기적이 됩니다', '믿음이 쌓일수록 소원도 가까워져요'];

const wishInput = document.getElementById('wish-input');
function startWishTransition() {
  if (isTransitioning) return;
  userWish = wishInput.value.trim();
  if (userWish) {
    isTransitioning = true; wishInput.blur();
    sfxBgm.play().then(() => { isBgmPlaying = true; document.getElementById('bgm-btn').innerText = '🔊'; });
    document.getElementById('sky').style.opacity = '1';
    document.getElementById('wish-bubble-wrap').classList.add('shrink');
    setTimeout(() => { document.getElementById('p1-stone').classList.add('roll-out'); }, 300);
    setTimeout(() => { document.getElementById('phase1').classList.add('hidden'); initPhase2(); }, 3500);
  }
}
wishInput.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); startWishTransition(); } });
wishInput.addEventListener('blur', () => { startWishTransition(); });

function initPhase2() {
  phase2Active = true;
  document.getElementById('phase2').classList.add('active');
  const canvas = document.getElementById('matter-canvas');
  const ctx = canvas.getContext('2d');
  let W = window.innerWidth, H = window.innerHeight;
  canvas.width = W; canvas.height = H;

  const { Engine, Render, Runner, Bodies, World, Events, Mouse, MouseConstraint, Composite } = Matter;
  const engine = Engine.create({ enableSleeping: true, positionIterations: 30 });
  engine.gravity.y = 1.8;

  const render = Render.create({ canvas, engine, options: { width: W, height: H, wireframes: false, background: 'transparent' } });

  window.addEventListener('resize', () => {
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W; canvas.height = H;
    Matter.Body.setPosition(ground, { x: W/2, y: H + 35 });
  });

  const ground = Bodies.rectangle(W/2, H+35, W*4, 50, { isStatic: true, label: 'ground' });
  World.add(engine.world, [ground]);

  function makeBody(cx, cy, src, w, h, isUserDropped = false, isStatic = false) {
    const b = Bodies.rectangle(cx, cy, w, h, { friction: 1.0, frictionStatic: 15.0, slop: 0.5, sleepThreshold: 45, isStatic: isStatic, render: { fillStyle: 'transparent' } });
    b._stone = { src, w, h }; b._isUserDropped = isUserDropped; return b;
  }

  const bW = W < 500 ? W/4.5 : 140;
  let currentStartX = W / 2 - (bW * 4.4) / 2;
  [{w: bW, h: bW*0.5}, {w: bW*1.2, h: bW*0.6}, {w: bW*1.1, h: bW*0.55}, {w: bW, h: bW*0.5}].forEach(d => {
    World.add(engine.world, makeBody(currentStartX + d.w/2, H - 5 - d.h/2, STONE_FILES[Math.floor(Math.random()*22)], d.w, d.h, false, true));
    currentStartX += d.w;
  });

  const mouse = Mouse.create(canvas); mouse.pixelRatio = window.devicePixelRatio || 1;
  const mc = MouseConstraint.create(engine, { mouse, constraint: { stiffness: 0.2, render: { visible: false } } });
  World.add(engine.world, mc);

  const ghostEl = document.getElementById('ghost-stone'), ghostImg = document.getElementById('ghost-img');
  let pending = { src: STONE_FILES[0], w: 80, h: 50 };
  const updateGhost = (x, y) => {
    if (!mc.body && phase2Active) { ghostEl.style.left = x + 'px'; ghostEl.style.top = y + 'px'; ghostEl.style.display = 'block'; }
    else ghostEl.style.display = 'none';
  };
  canvas.addEventListener('mousemove', e => updateGhost(e.clientX, e.clientY));
  canvas.addEventListener('touchstart', e => updateGhost(e.touches[0].clientX, e.touches[0].clientY), {passive: true});

  const handleDrop = (x, y) => {
    if (!mc.body && phase2Active) {
      const pick = Math.random() < 0.5 ? sfxStone1 : sfxStone2; pick.currentTime = 0; pick.play();
      World.add(engine.world, makeBody(x, y, pending.src, pending.w, pending.h, true, false));
      const nw = (W < 500 ? 50 : 70) + Math.random() * (W < 500 ? 40 : 80);
      pending = { src: STONE_FILES[Math.floor(Math.random()*22)], w: nw, h: nw*0.65 };
      ghostImg.src = pending.src; ghostImg.style.width = pending.w + 'px';
    }
  };
  canvas.addEventListener('mouseup', e => handleDrop(e.clientX, e.clientY));
  canvas.addEventListener('touchend', e => { if (e.cancelable) e.preventDefault(); if (e.changedTouches.length > 0) handleDrop(e.changedTouches[0].clientX, e.changedTouches[0].clientY); }, { passive: false });

  Runner.run(Runner.create(), engine);
  Render.run(render);

  Events.on(render, 'afterRender', () => {
    const stones = Composite.allBodies(engine.world).filter(b => b._stone);
    stones.forEach(b => {
      ctx.save(); ctx.translate(b.position.x, b.position.y); ctx.rotate(b.angle);
      ctx.drawImage(imgCache[b._src === 'stone20.png' ? 'stone20.png' : b._stone.src], -b._stone.w/2, -b._stone.h/2, b._stone.w, b._stone.h);
      ctx.restore();
      if (phase2Active && b._isUserDropped) {
        if (b.position.y > H - 40 && Math.abs(b.velocity.y) < 2.5) triggerCollapse();
        if (b.position.y > H + 50 || b.position.x < -100 || b.position.x > W + 100) triggerCollapse();
      }
    });
    const isSuccessReached = stones.some(s => s.position.y < H * 0.1 && s.position.y > 0 && Math.abs(s.velocity.y) < 0.5);
    if (!successFired && isSuccessReached) { successFired = true; triggerSuccess(); }
  });

  function spawnBubble() {
    if (!phase2Active) return;
    const stones = Composite.allBodies(engine.world).filter(b => b._stone);
    let bx = W * 0.5, by = H * 0.7;
    if (stones.length > 0) {
      const topStone = stones.reduce((prev, curr) => (prev.position.y < curr.position.y) ? prev : curr);
      bx = topStone.position.x + (Math.random() - 0.5) * (W < 500 ? W * 0.8 : 450);
      by = topStone.position.y - (40 + Math.random() * 100);
    }
    const el = document.createElement('div'); el.className = 'float-bubble';
    const pool = userWish ? [...floatMsgs, userWish, userWish] : floatMsgs;
    el.textContent = pool[Math.floor(Math.random() * pool.length)];
    el.style.left = Math.max(20, Math.min(W - 140, bx)) + 'px'; el.style.top = by + 'px';
    document.body.appendChild(el); setTimeout(() => el.remove(), 4500);
  }
  if (window.bubbleInterval) clearInterval(window.bubbleInterval);
  setTimeout(spawnBubble, 500); window.bubbleInterval = setInterval(spawnBubble, 4500);
}

function triggerCollapse() {
  if (!phase2Active) return; phase2Active = false; sfxFalling.play();
  const p2Cap = document.getElementById('p2-caption');
  if (p2Cap) p2Cap.style.display = 'none';
  document.getElementById('ghost-stone').style.display = 'none';
  document.querySelectorAll('.float-bubble').forEach(el => el.remove());
  document.getElementById('collapse-overlay').classList.add('show');
}

function triggerSuccess() {
  phase2Active = false; sfxZenBell.play(); 
  saveWishToCloudflare(userWish);
  const overlay = document.getElementById('success-overlay');
  const canvas = document.getElementById('ripple-canvas');
  const msg = document.getElementById('success-msg');
  const archiveBtn = document.getElementById('view-archive-btn');
  const ctx = canvas.getContext('2d');
  const p2Cap = document.getElementById('p2-caption');
  if (p2Cap) p2Cap.style.display = 'none';

  const overlay = document.getElementById('success-overlay');
  
  document.getElementById('return-btn').classList.add('inverted');
  document.getElementById('bgm-btn').classList.add('inverted');
  
  msg.innerHTML = `"${userWish}"<br><span class="success-sub-text">✦ 소원이 하늘에 닿았습니다 ✦</span>`;
  msg.style.animation = "msgIn 2.5s ease-out forwards";
  
  setTimeout(() => { if(archiveBtn) { archiveBtn.style.display = 'block'; archiveBtn.style.opacity = '1'; archiveBtn.style.animation = 'msgIn 1s forwards'; } }, 1000);

  document.getElementById('ghost-stone').style.display = 'none';
  document.querySelectorAll('.float-bubble').forEach(el => el.remove());
  overlay.classList.add('show');

  const W = window.innerWidth, H = window.innerHeight;
  canvas.width = W; canvas.height = H;
  let ripples = []; let frame = 0; const threshold = Math.min(W, H) * 0.5;
  function animate() {
    if (frame > 100 && ripples.length === 0) return;
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = `rgba(0, 0, 0, ${Math.min(frame/150, 1.0)})`; ctx.fillRect(0, 0, W, H);
    if (frame % 60 === 0 && frame < 300) ripples.push({ r: 0, opacity: 0.85, speed: 1.1 });
    for (let i = ripples.length - 1; i >= 0; i--) {
      let r = ripples[i]; r.r += r.speed; let blurRate = 0.08, fadeRate = 0.0012;
      if (r.r > threshold) { blurRate = 0.16; fadeRate = 0.01; }
      r.opacity -= fadeRate;
      if (r.opacity > 0) {
        ctx.save(); const dLW = 1.0 + (r.r * 0.06); const dBlur = r.r * blurRate;
        ctx.beginPath(); ctx.arc(W/2, H/2, r.r, 0, Math.PI*2);
        ctx.shadowColor = `rgba(255, 255, 255, ${r.opacity * 0.8})`; ctx.shadowBlur = dBlur;
        ctx.strokeStyle = `rgba(255, 255, 255, ${r.opacity})`; ctx.lineWidth = dLW; ctx.stroke(); ctx.restore();
      } else ripples.splice(i, 1);
    }
    frame++; requestAnimationFrame(animate);
  }
  animate();
}

function toggleBgm() {
  const btn = document.getElementById('bgm-btn');
  if (isBgmPlaying) { sfxBgm.pause(); isBgmPlaying = false; btn.innerText = '🔇'; }
  else { sfxBgm.play(); isBgmPlaying = true; btn.innerText = '🔊'; }
}

async function saveWishToCloudflare(text) {
  try { await fetch('/api/wishes', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text: text, stoneIdx: Math.floor(Math.random() * 22) + 1 }) }); }
  catch (e) { console.error(e); }
}

async function goToPhase3() {
  const p3 = document.getElementById('phase3'); 
  if (!p3) return;
  p3.classList.add('active');
  
  const container = document.getElementById('archive-container');
  container.innerHTML = "<p style='text-align:center; grid-column:1/-1;'>소원을 불러오는 중...</p>";

  try {
    const res = await fetch('/api/wishes'); 
    const data = await res.json(); 
    container.innerHTML = "";

    if (data && data.length > 0) {
      data.forEach(item => {
        const itemDiv = document.createElement('div'); 
        itemDiv.className = 'archive-item';
        
        // [수정] 모든 말풍선이 제각각 움직이도록 -3초 ~ 0초 사이의 랜덤 시작 시간 부여
        const randomDelay = (Math.random() * -3).toFixed(2);

        itemDiv.innerHTML = `
          <div class="arch-bubble-wrap" style="animation-delay: ${randomDelay}s">
            <div class="arch-text-box">${item.text}</div>
            <!-- [수정] 꼬리 동그라미 위치를 오른쪽으로 밀어남 (margin-left 수치 조정) -->
            <div class="arch-dot" style="width:10px; height:10px; margin-top:-5px; margin-left:55px;"></div>
            <div class="arch-dot" style="width:6px; height:6px; margin-top:3px; margin-left:35px;"></div>
          </div>
          <img src="stone${item.stoneIdx}.png" style="width:80px; height:auto; filter:grayscale(0.3);">
        `;
        container.appendChild(itemDiv);
      });
    } else { 
      container.innerHTML = "<p style='text-align:center; grid-column:1/-1;'>아직 쌓인 소원이 없습니다.</p>"; 
    }
  } catch (e) { 
    container.innerHTML = "<p style='text-align:center; grid-column:1/-1;'>불러오기에 실패했습니다.</p>"; 
  }
}
